stages:
  - build
  - deploy

build:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_IMAGE_TAG: $CI_COMMIT_REF_NAME
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker info
    - docker build --platform linux/arm64 -t $CI_REGISTRY_IMAGE:latest . 
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get update -qq
    - 'which ssh-agent || ( apt-get install -qq openssh-client )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - ssh admin@panel.karthiksys.in "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY & sudo docker pull $CI_REGISTRY_IMAGE:latest && sudo docker stop karthik-portfolio && sudo docker rm karthik-portfolio && sudo docker run -d --name karthik-portfolio -p 4017:80 $CI_REGISTRY_IMAGE:latest && exit"